name: CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci
      - run: npx vitest run
      - run: ./tests/sql/run.sh
      - run: deno check --config supabase/functions/deno.json supabase/functions/cuadra/index.ts
      - run: cd web && npm ci && npm run build
        env: { VITE_SUPABASE_URL: https://example.supabase.co, VITE_SUPABASE_ANON_KEY: ci }
